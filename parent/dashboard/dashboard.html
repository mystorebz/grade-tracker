<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard | ConnectUs</title>

    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; margin: 0; }
        .hidden { display: none !important; }

        .pd-topbar {
            background: linear-gradient(120deg, #1e1b4b 0%, #3730a3 55%, #4f46e5 100%);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .pd-topbar h1 { font-size: 22px; font-weight: 800; color: #fff; margin: 0 0 4px; letter-spacing: -0.4px; }
        .pd-topbar p  { font-size: 13px; color: rgba(255,255,255,0.65); margin: 0; font-weight: 500; }
        .pd-logout {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: #fff;
            font-weight: 700; font-size: 12.5px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: background 0.12s;
        }
        .pd-logout:hover { background: rgba(255,255,255,0.18); }

        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 14px; }
        .page-loader i { font-size: 32px; color: #6366f1; }
        .page-loader p { font-size: 13.5px; color: #94a3b8; font-weight: 600; margin: 0; }

        .pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .pd-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 22px;
            display: flex; flex-direction: column; gap: 14px; text-decoration: none;
            transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
        }
        .pd-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,27,75,0.08); border-color: #c7d2fe; }
        .pd-avatar {
            width: 48px; height: 48px; border-radius: 14px; background: #eef2ff; color: #4f46e5;
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0;
        }
        .pd-card-name { font-weight: 800; font-size: 15px; color: #1e293b; margin: 0; }
        .pd-card-meta { font-size: 12px; color: #64748b; font-weight: 600; margin: 2px 0 0; }
        .pd-card-cta { font-size: 12px; font-weight: 800; color: #4f46e5; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }

        @media (max-width: 767px) {
            .pd-topbar { padding: 18px 20px; }
        }
    </style>
</head>
<body>

    <div class="pd-topbar">
        <div>
            <h1>Parent Dashboard</h1>
            <p id="parentIdDisplay">Loading…</p>
        </div>
        <button id="logoutBtn" class="pd-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</button>
    </div>

    <div class="max-w-6xl mx-auto p-6 md:p-8 space-y-5">

        <div id="dashLoader" class="page-loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Loading your children…</p>
        </div>

        <div id="childCount" class="hidden text-[11px] font-black text-slate-400 uppercase tracking-widest px-1"></div>
        <div id="childGrid" class="pd-grid pb-8"></div>

    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
