<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | ConnectUs</title>

    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; }
        .hidden { display: none !important; }

        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 14px; }
        .page-loader i { font-size: 32px; color: #6366f1; }
        .page-loader p { font-size: 13.5px; color: #94a3b8; font-weight: 600; margin: 0; }

        /* ── Report sheet ──────────────────────────────────────────────────── */
        .rpt-sheet { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; }
        .rpt-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid #7f1d3d; padding-bottom: 18px; margin-bottom: 24px; }
        .rpt-head h1 { font-size: 20px; font-weight: 800; color: #0d1f35; margin: 0 0 4px; }
        .rpt-head p { font-size: 12.5px; color: #6b84a0; margin: 2px 0 0; font-weight: 600; }
        .rpt-print-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: #7f1d3d; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; transition: background 0.12s; }
        .rpt-print-btn:hover { background: #5c1230; }

        .rpt-section { margin-bottom: 28px; }
        .rpt-section:last-child { margin-bottom: 0; }
        .rpt-section-title { font-size: 12px; font-weight: 800; color: #7f1d3d; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid #f0e4e9; }

        .rpt-grade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; }
        .rpt-grade-tile { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
        .rpt-grade-tile .g-subject { font-weight: 800; font-size: 12.5px; color: #1e293b; margin: 0 0 4px; }
        .rpt-grade-tile .g-avg { font-size: 20px; font-weight: 800; margin: 0; }

        .rpt-history-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .rpt-history-table th { text-align: left; font-size: 10.5px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; }
        .rpt-history-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; font-weight: 600; color: #374f6b; }
        .rpt-history-table tr.rpt-overall-row td { font-weight: 800; color: #0d1f35; background: #f8fafc; }

        .rpt-att-summary { display: flex; flex-wrap: wrap; gap: 10px; }
        .rpt-att-chip { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; }
        .rpt-att-chip .n { font-size: 18px; font-weight: 800; color: #1e293b; }
        .rpt-att-chip .l { font-size: 10.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }

        .rpt-eval-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
        .rpt-eval-card .e-type { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #7f1d3d; margin: 0 0 3px; }
        .rpt-eval-card .e-meta { font-size: 11px; color: #6b84a0; font-weight: 600; margin: 0; }

        .rpt-empty { text-align: center; padding: 18px; color: #94a3b8; font-size: 12px; font-weight: 700; }

        @media print {
            #layout-sidebar-container, #layout-topbar-container, .no-print { display: none !important; }
            body { background: #fff !important; }
            .rpt-sheet { border: none; border-radius: 0; padding: 0; }
            .rpt-section { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="layout-sidebar-container" class="flex-shrink-0 z-20 h-full"></div>

    <main id="dashboardMain" class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="layout-topbar-container" class="flex-shrink-0 z-10"></div>

        <div class="flex-1 overflow-y-auto">
            <div class="max-w-4xl mx-auto p-6 md:p-8">

                <div id="reportLoader" class="page-loader">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Building report…</p>
                </div>

                <div id="reportError" class="hidden text-center py-10 text-slate-400 text-[13px] font-bold bg-white rounded-xl border border-slate-200"></div>

                <div id="reportSheet" class="rpt-sheet hidden">
                    <div class="rpt-head">
                        <div>
                            <h1 id="rptStudentName">Student</h1>
                            <p id="rptStudentMeta"></p>
                            <p id="rptGeneratedAt"></p>
                        </div>
                        <button id="printBtn" class="rpt-print-btn no-print"><i class="fa-solid fa-print"></i> Generate Report</button>
                    </div>

                    <section class="rpt-section">
                        <p class="rpt-section-title">Current Grades</p>
                        <div id="rptCurrentGrades"></div>
                    </section>

                    <section class="rpt-section">
                        <p class="rpt-section-title">Academic History</p>
                        <div id="rptHistory"></div>
                    </section>

                    <section class="rpt-section">
                        <p class="rpt-section-title">Attendance</p>
                        <div id="rptAttendance"></div>
                    </section>

                    <section class="rpt-section">
                        <p class="rpt-section-title">Evaluations</p>
                        <div id="rptEvaluations"></div>
                    </section>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="reports.js"></script>
</body>
</html>
