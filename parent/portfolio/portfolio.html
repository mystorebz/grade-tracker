<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Family Portal</title>

    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!--
        MODULE 2: Portfolio & work-photo gallery (read-only). Shows every
        submission for the active child that carries uploaded media —
        "Show your work" photos (submission.workUploads) and file/drawing
        answers (submission.responses[].attachmentUrl) — with the subject,
        submission date and the teacher's score + notes from the matching
        grade record. Data path is the same one parent/assignments uses
        (assets/js/submissions.js); no new Firestore or Storage grants.
    -->
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; }
        .hidden { display: none !important; }

        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 14px; }
        .page-loader i { font-size: 32px; color: #7f1d3d; }
        .page-loader p { font-size: 13.5px; color: #94a3b8; font-weight: 600; margin: 0; }
        .pf-empty { text-align: center; padding: 48px 20px; color: #94a3b8; font-size: 13px; font-weight: 700; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; }
        .pf-empty i { display: block; font-size: 28px; margin-bottom: 10px; color: #cbd5e1; }

        .pf-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .pf-title { font-size: 20px; font-weight: 900; color: #1e293b; margin: 0; }
        .pf-sub { font-size: 12.5px; font-weight: 600; color: #64748b; margin: 2px 0 0; }
        .pf-summary { font-size: 12px; font-weight: 800; color: #7f1d3d; background: rgba(127,29,61,0.07); border: 1px solid rgba(127,29,61,0.15); padding: 6px 12px; border-radius: 999px; }

        .pf-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .pf-tab { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; color: #475569; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .pf-tab:hover { border-color: #7f1d3d; color: #7f1d3d; }
        .pf-tab.is-active { background: #7f1d3d; border-color: #7f1d3d; color: #fff; }
        .pf-tab-count { font-size: 10px; font-family: 'DM Mono', monospace; background: #f1f5f9; color: #64748b; border-radius: 8px; padding: 0 6px; line-height: 16px; }
        .pf-tab.is-active .pf-tab-count { background: rgba(255,255,255,0.2); color: #fff; }

        .pf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .pf-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
        .pf-media { display: grid; gap: 2px; background: #f1f5f9; aspect-ratio: 4 / 3; }
        .pf-media.n1 { grid-template-columns: 1fr; }
        .pf-media.n2 { grid-template-columns: 1fr 1fr; }
        .pf-media.n3, .pf-media.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .pf-media.n3 .pf-thumb:first-child { grid-row: span 2; }
        .pf-thumb { position: relative; border: none; padding: 0; margin: 0; cursor: pointer; overflow: hidden; background: #e2e8f0; min-height: 0; }
        .pf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
        .pf-thumb:hover img { transform: scale(1.04); }
        .pf-thumb:focus-visible { outline: 3px solid #f59e0b; outline-offset: -3px; }
        .pf-thumb-more { position: absolute; inset: 0; background: rgba(15,23,42,0.55); color: #fff; font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .pf-file { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 100%; color: #7f1d3d; text-decoration: none; font-size: 11px; font-weight: 800; padding: 8px; text-align: center; background: #fdf2f5; }
        .pf-file i { font-size: 26px; }
        .pf-file span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pf-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .pf-card-title { font-size: 14px; font-weight: 800; color: #1e293b; margin: 0; line-height: 1.3; }
        .pf-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; font-weight: 700; color: #64748b; }
        .pf-chip { background: #f1f5f9; color: #334155; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 800; }
        .pf-late { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; font-weight: 800; }
        .pf-score { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; font-weight: 800; font-size: 13px; }
        .pf-score-val { font-family: 'DM Mono', monospace; font-size: 15px; }
        .pf-pending { background: #f8fafc; color: #64748b; border: 1px dashed #cbd5e1; }
        .pf-feedback { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 12px; }
        .pf-feedback-label { font-size: 10px; font-weight: 800; color: #1e3a8a; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 4px; }
        .pf-feedback-text { font-size: 12.5px; color: #334155; font-weight: 500; margin: 0; white-space: pre-wrap; line-height: 1.5; max-height: 7.5em; overflow-y: auto; }

        /* Lightbox */
        #pfLightbox { position: fixed; inset: 0; z-index: 120; background: rgba(2,6,23,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 16px 24px; }
        #pfLightbox img { max-width: 100%; max-height: calc(100vh - 140px); object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .pf-lb-btn { position: absolute; background: rgba(255,255,255,0.12); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .pf-lb-btn:hover { background: rgba(255,255,255,0.24); }
        .pf-lb-close { top: 12px; right: 12px; }
        .pf-lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
        .pf-lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
        .pf-lb-caption { color: #e2e8f0; font-size: 13px; font-weight: 700; margin-top: 14px; text-align: center; }
        .pf-lb-caption a { color: #fbbf24; margin-left: 10px; font-size: 12px; }

        @media (max-width: 640px) { .pf-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="layout-sidebar-container" class="flex-shrink-0 z-20 h-full"></div>

    <main id="dashboardMain" class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="layout-topbar-container" class="flex-shrink-0 z-10"></div>

        <div class="flex-1 overflow-y-auto">
            <div class="max-w-6xl mx-auto p-6 md:p-8 space-y-6">

                <div class="pf-header">
                    <div>
                        <h2 class="pf-title" id="pfTitle">Portfolio</h2>
                        <p class="pf-sub">Photos and files your child turned in, with the teacher's score and feedback.</p>
                    </div>
                    <span class="pf-summary hidden" id="pfSummary"></span>
                </div>

                <div id="pfTabs" class="pf-tabs hidden" role="tablist" aria-label="Filter by subject"></div>

                <div id="pfLoader" class="page-loader">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Loading portfolio…</p>
                </div>

                <div id="pfEmpty" class="pf-empty hidden"></div>
                <div id="pfGrid" class="pf-grid hidden"></div>
            </div>
        </div>
    </main>

    <div id="pfLightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button type="button" class="pf-lb-btn pf-lb-close" data-lb="close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <button type="button" class="pf-lb-btn pf-lb-prev" data-lb="prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
        <img id="pfLbImg" alt="">
        <button type="button" class="pf-lb-btn pf-lb-next" data-lb="next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
        <p class="pf-lb-caption" id="pfLbCaption"></p>
    </div>

    <script type="module" src="portfolio.js"></script>
</body>
</html>
