<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | ConnectUs</title>

    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --blue-900:#1e3a8a; --blue-700:#1d4ed8; --blue-600:#2563eb;
            --bg:#f8faff; --text:#1f2937; --white:#ffffff;
        }
        *,*::before,*::after{box-sizing:border-box}
        body{
            margin:0;
            font-family:'Nunito','Nunito Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            color:var(--text); background:var(--bg); line-height:1.6;
            min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; padding:40px 20px;
        }

        .error-code{
            font-size:15px; font-weight:800; letter-spacing:2px;
            color:var(--blue-600); text-transform:uppercase; margin-bottom:14px;
        }
        h1{font-size:32px; font-weight:900; margin:0 0 12px; color:var(--blue-900)}
        p{font-size:16px; font-weight:600; color:#4b5563; max-width:440px; margin:0 auto 28px}

        .btn{
            display:inline-flex; align-items:center; gap:8px;
            padding:14px 32px; border-radius:9999px; font-weight:800; font-size:15px;
            text-decoration:none; color:var(--white); background:var(--blue-600);
            box-shadow:0 8px 18px rgba(37,99,235,.25);
            transition:transform .2s, box-shadow .2s;
        }
        .btn:hover{transform:translateY(-2px)}

        @media (max-width: 480px){
            h1{font-size:26px}
        }
    </style>
</head>
<body>
    <div class="error-code">Error 404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist, may have moved, or the link might have a typo.</p>
    <a href="/index.html" class="btn">Back to Home</a>
</body>
</html>
