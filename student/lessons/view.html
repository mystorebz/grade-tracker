<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson | ConnectUs</title>

    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Quill.js — read-only rendering surface for Document-format lessons.
         Same version pinned in the Teacher Builder so saved HTML (including
         the custom assignment-embed markup) renders identically here. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>

    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; }
        .hidden { display: none !important; }

        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 14px; }
        .page-loader i { font-size: 32px; color: #6366f1; }
        .page-loader p { font-size: 13.5px; color: #94a3b8; font-weight: 600; margin: 0; }

        /* ── Lesson top bar ─────────────────────────────────────────────── */
        .lv-topbar {
            background: linear-gradient(120deg, #1e1b4b 0%, #3730a3 55%, #4f46e5 100%);
            flex-shrink: 0;
        }
        .lv-progress-track { background: rgba(255,255,255,0.15); border-radius: 999px; height: 6px; overflow: hidden; }
        .lv-progress-fill { background: linear-gradient(90deg, #a5b4fc, #fff); height: 100%; border-radius: 999px; transition: width 0.25s ease; }

        /* ── Slide deck ─────────────────────────────────────────────────── */
        .lv-deck-stage { display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; padding: 24px; }
        .lv-slide-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(30,27,75,0.08); border: 1px solid #e2e8f0; width: 100%; max-width: 760px; min-height: 420px; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
        .lv-nav-btn { width: 48px; height: 48px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; color: #4338ca; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(30,27,75,0.08); transition: transform 0.12s, box-shadow 0.12s; flex-shrink: 0; }
        .lv-nav-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(30,27,75,0.14); }
        .lv-nav-btn:disabled { opacity: 0.35; cursor: default; }

        .lv-media-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f172a; border-radius: 14px; overflow: hidden; }
        .lv-media-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .lv-media-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; background: #1e293b; }

        /* ── Document (Quill read-only) ─────────────────────────────────── */
        .lv-doc-layout { display: flex; gap: 32px; max-width: 960px; margin: 0 auto; width: 100%; padding: 32px 24px 64px; }
        .lv-toc { width: 220px; flex-shrink: 0; position: sticky; top: 24px; align-self: flex-start; }
        .lv-toc-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 10px; }
        .lv-toc-link { display: block; font-size: 12.5px; font-weight: 700; color: #4338ca; padding: 6px 10px; border-radius: 8px; text-decoration: none; margin-bottom: 2px; line-height: 1.4; cursor: pointer; }
        .lv-toc-link:hover { background: #eef2ff; }
        .lv-toc-link.lv-toc-h2 { padding-left: 20px; font-weight: 600; color: #64748b; font-size: 12px; }
        .lv-doc-body { flex: 1; min-width: 0; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 2px 12px rgba(30,27,75,0.05); padding: 8px; }
        #docViewerEditor .ql-editor { font-family: 'DM Sans', sans-serif; font-size: 15px; color: #1e293b; line-height: 1.7; padding: 32px 40px; }
        #docViewerEditor .ql-editor h1 { font-size: 26px; font-weight: 800; scroll-margin-top: 24px; }
        #docViewerEditor .ql-editor h2 { font-size: 20px; font-weight: 800; scroll-margin-top: 24px; }
        #docViewerEditor .ql-editor h3 { font-size: 17px; font-weight: 700; scroll-margin-top: 24px; }
        #docViewerEditor.ql-container { border: none; font-family: 'DM Sans', sans-serif; }
        #docViewerEditor .ql-editor .lv-lazy-media { position: relative; width: 100%; max-width: 560px; aspect-ratio: 16/9; background: #0f172a; border-radius: 12px; overflow: hidden; margin: 12px 0; }
        #docViewerEditor .ql-editor .lv-lazy-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        /* Assignment embed card, read-only view — same visual language as
           the Teacher Builder's editable embed, but clickable to open the
           submission panel instead of merely selectable. */
        .assignment-embed { display: inline-flex; align-items: center; gap: 6px; background: #eef2ff; border: 1px solid #c7d2fe; color: #4338ca; font-weight: 700; font-size: 12.5px; padding: 5px 12px 5px 9px; border-radius: 999px; cursor: pointer; user-select: none; transition: background 0.12s; }
        .assignment-embed:hover { background: #e0e7ff; }
        .assignment-embed .lv-embed-status { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 999px; margin-left: 2px; }
        .assignment-embed .lv-embed-status.lv-status-done { background: #dcfce7; color: #15803d; }
        .assignment-embed .lv-embed-status.lv-status-pending { background: #fef3c7; color: #92400e; }

        /* ── Assignment submission panel (slide-in, mirrors assignments.js) ── */
        .overlay { transition: opacity 0.25s; }
        .side-panel { transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1); }

        @media (max-width: 767px) {
            .lv-doc-layout { flex-direction: column; padding: 20px 16px 48px; }
            .lv-toc { display: none; }
            .lv-slide-card { padding: 28px; min-height: 320px; }
            #docViewerEditor .ql-editor { padding: 20px; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="layout-sidebar-container" class="flex-shrink-0 z-20 h-full"></div>

    <main id="dashboardMain" class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="layout-topbar-container" class="flex-shrink-0 z-10"></div>

        <!-- ═══ LOADING / ERROR STATES ═══════════════════════════════════ -->
        <div id="lessonLoader" class="page-loader flex-1">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Loading lesson…</p>
        </div>

        <div id="lessonErrorState" class="hidden flex-1 flex items-center justify-center p-8">
            <div class="text-center max-w-sm">
                <div class="w-14 h-14 rounded-2xl bg-rose-50 border border-rose-200 text-rose-500 flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <p id="lessonErrorMsg" class="text-[13.5px] font-bold text-slate-500 leading-relaxed">This lesson isn't available.</p>
                <a href="../stream/stream.html" class="inline-flex items-center gap-2 mt-5 text-[13px] font-black text-indigo-600 hover:text-indigo-700">
                    <i class="fa-solid fa-arrow-left"></i> Back to Class Stream
                </a>
            </div>
        </div>

        <!-- ═══ LESSON VIEWER (shown once loaded) ════════════════════════ -->
        <div id="lessonViewerRoot" class="hidden flex-1 flex flex-col overflow-hidden min-h-0">

            <!-- Top bar: title, subject, back link, completion progress -->
            <div class="lv-topbar px-5 md:px-8 py-4">
                <div class="flex items-center justify-between gap-4 mb-3">
                    <div class="min-w-0 flex items-center gap-3">
                        <a href="../stream/stream.html" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center flex-shrink-0 transition" title="Back to Class Stream">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </a>
                        <div class="min-w-0">
                            <h1 id="lvTitle" class="text-base md:text-lg font-black text-white leading-tight truncate m-0"></h1>
                            <p id="lvSubject" class="text-[11.5px] text-indigo-200 font-bold m-0"></p>
                        </div>
                    </div>
                    <span id="lvSlideCount" class="hidden md:inline-flex text-[11px] font-black text-indigo-100 bg-white/10 px-3 py-1.5 rounded-lg flex-shrink-0 whitespace-nowrap"></span>
                </div>
                <div class="lv-progress-track">
                    <div id="lvProgressFill" class="lv-progress-fill" style="width:0%"></div>
                </div>
            </div>

            <!-- Slide Deck stage (Slides format only) -->
            <div id="lvDeckView" class="hidden flex-1 flex-col overflow-hidden min-h-0">
                <div class="lv-deck-stage">
                    <div class="flex items-center gap-4 md:gap-6 w-full max-w-4xl mx-auto">
                        <button id="lvPrevBtn" class="lv-nav-btn" title="Previous (←)"><i class="fa-solid fa-chevron-left"></i></button>
                        <div id="lvSlideCanvas" class="flex-1 min-w-0"></div>
                        <button id="lvNextBtn" class="lv-nav-btn" title="Next (→)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex items-center justify-center gap-1.5 pb-5 flex-shrink-0" id="lvDotRow"></div>
            </div>

            <!-- Document stage (Document format only) -->
            <div id="lvDocView" class="hidden flex-1 overflow-y-auto min-h-0">
                <div class="lv-doc-layout">
                    <nav class="lv-toc">
                        <p class="lv-toc-title">On this page</p>
                        <div id="lvTocList"></div>
                    </nav>
                    <div class="lv-doc-body">
                        <div id="docViewerEditor"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ═══ ASSIGNMENT SUBMISSION PANEL (slide-in, shared by both formats) ═══ -->
    <div id="lvAssignmentOverlay" class="overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end hidden opacity-0">
        <div id="lvAssignmentInner" class="side-panel bg-[#f8fafc] w-full max-w-xl h-full shadow-2xl flex flex-col translate-x-full">
            <div class="flex items-start justify-between gap-3 px-6 py-5 border-b border-slate-200 bg-white flex-shrink-0">
                <div class="min-w-0">
                    <p id="lvAsgSubjectLabel" class="text-[11px] font-black text-indigo-500 uppercase tracking-widest mb-1"></p>
                    <h3 id="lvAsgTitle" class="text-lg font-black text-slate-800 leading-tight"></h3>
                    <div id="lvAsgMetaRow" class="flex items-center gap-2 flex-wrap mt-2"></div>
                </div>
                <button id="lvCloseAssignmentBtn" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition flex-shrink-0">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-5" id="lvAssignmentBody"></div>
        </div>
    </div>

    <script type="module" src="../../assets/js/lessons/viewer.js"></script>
</body>
</html>
