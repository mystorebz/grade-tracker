<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments | ConnectUs</title>

    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f0f2f8; }
        .hidden { display: none !important; }

        .asg-topbar {
            background: linear-gradient(120deg, #1e1b4b 0%, #3730a3 55%, #4f46e5 100%);
            padding: 28px 40px;
        }
        .asg-topbar h1 { font-size: 22px; font-weight: 800; color: #fff; margin: 0 0 4px; letter-spacing: -0.4px; }
        .asg-topbar p  { font-size: 13px; color: rgba(255,255,255,0.6); margin: 0; font-weight: 500; }

        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 14px; }
        .page-loader i { font-size: 32px; color: #6366f1; }
        .page-loader p { font-size: 13.5px; color: #94a3b8; font-weight: 600; margin: 0; }

        .asg-card { cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
        .asg-card:hover { border-color: #a5b4fc; box-shadow: 0 2px 10px rgba(79,70,229,0.08); }

        /* ── Detail side panel (mirrors the teacher Subjects panel pattern) ── */
        .overlay { transition: opacity 0.25s; }
        .side-panel { transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ── Focus page: one assignment, nothing else on screen ── */
        body.asg-focus #layout-sidebar-container,
        body.asg-focus #layout-topbar-container { display: none !important; }
        body.asg-focus { background: #f6f7fb; }
        .asg-focus-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 24px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; }
        .asg-focus-back { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 800; color: #334155; background: #fff; border: 1px solid #e2e8f0; transition: background .15s, color .15s; }
        .asg-focus-back:hover { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
        .asg-focus-back:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
        .asg-focus-subject { margin: 0; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #6366f1; }
        .asg-save-state { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #64748b; opacity: 0; transition: opacity .35s ease, color .2s; white-space: nowrap; }
        .asg-save-state.is-visible { opacity: 1; }
        .asg-save-state.is-quiet { opacity: .55; }
        .asg-save-state::before { content: ''; width: 7px; height: 7px; border-radius: 999px; background: #10b981; }
        .asg-save-state[data-state="saving"]::before { background: #f59e0b; animation: asg-pulse 1s ease-in-out infinite; }
        .asg-save-state[data-state="pending"]::before { background: #10b981; }
        .asg-save-state[data-state="local"] { color: #b45309; }
        .asg-save-state[data-state="local"]::before { background: #f59e0b; }
        @keyframes asg-pulse { 50% { opacity: .3; } }
        .asg-focus-page { max-width: 820px; margin: 0 auto; padding: 36px 28px 80px; }
        .asg-focus-head { padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; }
        .asg-focus-head h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -.5px; color: #0f172a; }
        .asg-focus-page #assignmentDetailBody { font-size: 15px; }

        @media (max-width: 767px) {
            .asg-topbar { padding: 20px; }
            .asg-focus-bar { padding: 10px 16px; }
            .asg-focus-page { padding: 24px 16px 64px; }
            .asg-focus-head h1 { font-size: 22px; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="layout-sidebar-container" class="flex-shrink-0 z-20 h-full"></div>

    <main id="dashboardMain" class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="layout-topbar-container" class="flex-shrink-0 z-10"></div>

        <div class="flex-1 overflow-y-auto">

            <div id="assignmentListView">
            <div class="asg-topbar">
                <h1>Assignments</h1>
                <p>Everything your teacher has assigned — read the instructions and submit your work here</p>
            </div>

            <div class="max-w-3xl mx-auto p-6 md:p-8 space-y-5">

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center gap-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Subject</label>
                    <select id="subjectFilter" class="form-input p-2.5 bg-white border border-slate-200 rounded-lg text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 min-w-[180px]">
                        <option value="">All Subjects</option>
                    </select>
                </div>

                <div id="assignmentsLoader" class="page-loader">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Loading your assignments…</p>
                </div>

                <div id="assignmentsEmpty" class="hidden text-center py-10 text-slate-400 text-[13px] font-bold bg-white rounded-xl border border-slate-200"></div>

                <div id="assignmentSections" class="hidden space-y-8 pb-8">
                    <section>
                        <div class="flex items-center gap-2 mb-3 px-1">
                            <p class="text-[11px] font-black text-slate-500 uppercase tracking-widest m-0">To Do</p>
                            <span id="todoCount" class="text-[10.5px] font-black bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 to do</span>
                        </div>
                        <div id="todoList" class="space-y-3"></div>
                    </section>
                    <section>
                        <div class="flex items-center gap-2 mb-3 px-1">
                            <p class="text-[11px] font-black text-slate-500 uppercase tracking-widest m-0">Done</p>
                            <span id="doneCount" class="text-[10.5px] font-black bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 done</span>
                        </div>
                        <div id="doneList" class="space-y-3"></div>
                    </section>
                </div>

            </div>
            </div>

            <!-- ── Assignment focus page (assignments.html?a={id}) ── -->
            <div id="assignmentFocus" class="hidden min-h-full">
                <div class="asg-focus-bar">
                    <button type="button" onclick="closeAssignmentDetail()" class="asg-focus-back" aria-label="Back to all assignments">
                        <i class="fa-solid fa-arrow-left"></i><span>Assignments</span>
                    </button>
                    <p id="adSubjectLabel" class="asg-focus-subject"></p>
                    <span id="adSaveState" class="asg-save-state" role="status" aria-live="polite"></span>
                    <span id="adTimer"></span>
                    <span id="adXpSlot"></span>
                </div>
                <article class="asg-focus-page">
                    <header class="asg-focus-head">
                        <h1 id="adTitle"></h1>
                        <div id="adMetaRow" class="flex items-center gap-2 flex-wrap mt-3"></div>
                    </header>
                    <div id="assignmentDetailBody" class="space-y-5"></div>
                </article>
            </div>
        </div>
    </main>

    <script type="module" src="assignments.js"></script>
</body>
</html>
